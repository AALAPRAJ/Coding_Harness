version: '3.8'

services:
  # ------------------------------------------
  # 1. PostgreSQL Database
  # ------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: coding-harness-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-coding_harness}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coding-harness-net

  # ------------------------------------------
  # 2. Redis Message & Job Queue
  # ------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: coding-harness-redis-prod
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coding-harness-net

  # ------------------------------------------
  # 3. Backend API Server & Worker
  # ------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: coding-harness-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-coding_harness}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-coding-harness-prod-secret-key-replace-in-env}
      CORS_ORIGIN: '*'
      SANDBOX_IMAGE: node:18-alpine
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      # Mount host Docker socket so backend can spawn isolated sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      - workspaces_data:/tmp/coding-harness/workspaces
      - uploads_data:/tmp/coding-harness/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coding-harness-net

  # ------------------------------------------
  # 4. Frontend Next.js Web App
  # ------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: coding-harness-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_WS_URL: http://localhost
    depends_on:
      - backend
    networks:
      - coding-harness-net

  # ------------------------------------------
  # 5. Nginx Reverse Proxy
  # ------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: coding-harness-nginx-prod
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - coding-harness-net

# ------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------
volumes:
  postgres_prod_data:
  redis_prod_data:
  workspaces_data:
  uploads_data:

# ------------------------------------------
# Internal Bridge Network
# ------------------------------------------
networks:
  coding-harness-net:
    driver: bridge
